<!DOCTYPE html>
<html class="writer-html5" lang="{{ site.lang | default: 'en' }}">
  {% include subnav.html %}
  {% include head.html %}
  <body class="wy-body-for-nav">
    <div class="wy-grid-for-nav">
      <nav data-toggle="wy-nav-shift" class="wy-nav-side">
        <div class="wy-side-scroll">
          <div class="wy-side-nav-search">
            <a href="{{ site.baseurl }}/" class="icon icon-home">Linux System Roles</a>
            <div role="search">
              <form id="rtd-search-form" class="wy-form" action="{{ site.baseurl }}/search.html" method="get">
                <label class="sr-only" for="q">Search docs:</label>
                <input type="text" class="st-default-search-input" id="q" name="search" placeholder="Search docs" />
              </form>
            </div>
          </div>
          {% include sidebar-nav.html %}
        </div>
      </nav>

      <section data-toggle="wy-nav-shift" class="wy-nav-content-wrap">
        <nav class="wy-nav-top" aria-label="Mobile navigation menu">
          <i data-toggle="wy-nav-top" class="fa fa-bars"></i>
          <a href="{{ site.baseurl }}/">Linux System Roles</a>
        </nav>

        <div class="wy-nav-content">
          <div class="rst-content">
            {% include breadcrumbs.html %}
            <div role="main" class="document" itemscope="itemscope" itemtype="http://schema.org/Article">
              <div itemprop="articleBody">
                <section>
                  {{ content }}
                </section>
              </div>
            </div>
            {% include footer.html %}
          </div>
        </div>
      </section>
    </div>

    <script src="{{ site.baseurl }}/_static/jquery.js"></script>
    <script src="{{ site.baseurl }}/_static/_sphinx_javascript_frameworks_compat.js"></script>
    <script src="{{ site.baseurl }}/_static/js/theme.js"></script>
    <script>
      jQuery(function () {
        SphinxRtdTheme.Navigation.enable(true);
      });
    </script>
  </body>
</html>
