# Site settings
name: Linux System Roles
email: twoerner<AT>redhat.com
author: Thomas Woerner
lang: "en"

keywords: Automation, linux, Ansible, roles, system roles
description: > # this means to ignore newlines until "baseurl:"
  Welcome to the Linux System Roles project homepage!

baseurl:
url: https://linux-system-roles.github.io
#production_url: http://linux-system-roles.org

# Exclude our ruby stuff
exclude: [.bundle, bin, vendor, Gemfile, Gemfile.lock, Rakefile, s3_website.yml, .last_optimized, slim-pickins-jekyll-theme-master]

# Include antsibull-docs static assets (underscore-prefixed directory).
# Styles originate from https://github.com/ansible-community/antsibull-docs
# (sphinx_antsibull_ext); copy from a docs build's _static/ when updating.
# Jekyll excludes files whose names start with "_" unless listed here explicitly.
include:
  - "_static"
  - "_static/_sphinx_javascript_frameworks_compat.js"


# Build settings
markdown: kramdown
kramdown:
  input: GFM

destination: _site

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: atom.xml
  
# Compress our Css
sass:
    style: :compressed

permalink: /:year/:month/:title
paginate: 5
paginate_path: "/blog/page/:num/"

defaults:
  - scope:
      path: "documentation/design_docs/logging"
    values:
      render_with_liquid: false

#### SEO Stuff
# Google Analytics
#google_universal_analytics: 
#google_universal_analytics_cookiedomain: auto
